name: sightings

on:
  schedule:
    - cron: "17 */2 * * *"   # 2時間おき（UTC）
  workflow_dispatch: {}        # 手動実行も可

permissions:
  contents: write

concurrency:
  group: sightings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r backend/requirements.txt

      - name: Fetch sightings
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python backend/fetch_sightings.py

      - name: Commit output
        run: |
          git config user.name  "sightings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/out/sightings.json backend/out/geocode-cache.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update sightings ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
